<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="slide.css"></head>
<body>
<div class="slide">
  <div class="window">
    <div class="titlebar">
      <div class="dots"><span class="r"></span><span class="y"></span><span class="g"></span></div>
      <div class="win-title">Weather — This Week</div>
    </div>

    <div class="win-body">
      <div class="forecast-h target">
        <h1>This week's forecast</h1>
        <span class="sub">Mon – Sun</span>
      </div>

      <div class="week">
        <!-- Mon -->
        <div class="day rain">
          <span class="dow">Mon</span>
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 15.5a4 4 0 0 1 .3-7.98 5.5 5.5 0 0 1 10.6.98 3.5 3.5 0 0 1-.4 6.99z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/><line x1="8.5" y1="18" x2="7.5" y2="20.5" stroke="#0369a1" stroke-width="2"/><line x1="12.5" y1="18" x2="11.5" y2="20.5" stroke="#0369a1" stroke-width="2"/><line x1="16.5" y1="18" x2="15.5" y2="20.5" stroke="#0369a1" stroke-width="2"/></svg>
          <span class="temp">16°</span>
          <span class="rain-pct"><svg viewBox="0 0 24 24" fill="#0369a1"><path d="M12 2.5S5.5 10 5.5 14.5a6.5 6.5 0 0 0 13 0C18.5 10 12 2.5 12 2.5z"/></svg>60%</span>
        </div>
        <!-- Tue -->
        <div class="day rain">
          <span class="dow">Tue</span>
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 15.5a4 4 0 0 1 .3-7.98 5.5 5.5 0 0 1 10.6.98 3.5 3.5 0 0 1-.4 6.99z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/><line x1="8.5" y1="18" x2="7.5" y2="20.5" stroke="#0369a1" stroke-width="2"/><line x1="12.5" y1="18" x2="11.5" y2="20.5" stroke="#0369a1" stroke-width="2"/><line x1="16.5" y1="18" x2="15.5" y2="20.5" stroke="#0369a1" stroke-width="2"/></svg>
          <span class="temp">17°</span>
          <span class="rain-pct"><svg viewBox="0 0 24 24" fill="#0369a1"><path d="M12 2.5S5.5 10 5.5 14.5a6.5 6.5 0 0 0 13 0C18.5 10 12 2.5 12 2.5z"/></svg>80%</span>
        </div>
        <!-- Wed -->
        <div class="day rain">
          <span class="dow">Wed</span>
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 15.5a4 4 0 0 1 .3-7.98 5.5 5.5 0 0 1 10.6.98 3.5 3.5 0 0 1-.4 6.99z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/><line x1="8.5" y1="18" x2="7.5" y2="20.5" stroke="#0369a1" stroke-width="2"/><line x1="12.5" y1="18" x2="11.5" y2="20.5" stroke="#0369a1" stroke-width="2"/><line x1="16.5" y1="18" x2="15.5" y2="20.5" stroke="#0369a1" stroke-width="2"/></svg>
          <span class="temp">16°</span>
          <span class="rain-pct"><svg viewBox="0 0 24 24" fill="#0369a1"><path d="M12 2.5S5.5 10 5.5 14.5a6.5 6.5 0 0 0 13 0C18.5 10 12 2.5 12 2.5z"/></svg>40%</span>
        </div>
        <!-- Thu (sunny) -->
        <div class="day sun">
          <span class="dow">Thu</span>
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5" fill="#fde68a" stroke="#f59e0b"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/></svg>
          <span class="temp">22°</span>
          <span class="rain-pct empty"><svg viewBox="0 0 24 24" fill="#0369a1"><path d="M12 2.5S5.5 10 5.5 14.5a6.5 6.5 0 0 0 13 0C18.5 10 12 2.5 12 2.5z"/></svg>0%</span>
        </div>
        <!-- Fri -->
        <div class="day rain">
          <span class="dow">Fri</span>
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 15.5a4 4 0 0 1 .3-7.98 5.5 5.5 0 0 1 10.6.98 3.5 3.5 0 0 1-.4 6.99z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/><line x1="8.5" y1="18" x2="7.5" y2="20.5" stroke="#0369a1" stroke-width="2"/><line x1="12.5" y1="18" x2="11.5" y2="20.5" stroke="#0369a1" stroke-width="2"/><line x1="16.5" y1="18" x2="15.5" y2="20.5" stroke="#0369a1" stroke-width="2"/></svg>
          <span class="temp">17°</span>
          <span class="rain-pct"><svg viewBox="0 0 24 24" fill="#0369a1"><path d="M12 2.5S5.5 10 5.5 14.5a6.5 6.5 0 0 0 13 0C18.5 10 12 2.5 12 2.5z"/></svg>70%</span>
        </div>
        <!-- Sat -->
        <div class="day rain">
          <span class="dow">Sat</span>
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 15.5a4 4 0 0 1 .3-7.98 5.5 5.5 0 0 1 10.6.98 3.5 3.5 0 0 1-.4 6.99z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/><line x1="8.5" y1="18" x2="7.5" y2="20.5" stroke="#0369a1" stroke-width="2"/><line x1="12.5" y1="18" x2="11.5" y2="20.5" stroke="#0369a1" stroke-width="2"/><line x1="16.5" y1="18" x2="15.5" y2="20.5" stroke="#0369a1" stroke-width="2"/></svg>
          <span class="temp">16°</span>
          <span class="rain-pct"><svg viewBox="0 0 24 24" fill="#0369a1"><path d="M12 2.5S5.5 10 5.5 14.5a6.5 6.5 0 0 0 13 0C18.5 10 12 2.5 12 2.5z"/></svg>50%</span>
        </div>
        <!-- Sun -->
        <div class="day rain">
          <span class="dow">Sun</span>
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 15.5a4 4 0 0 1 .3-7.98 5.5 5.5 0 0 1 10.6.98 3.5 3.5 0 0 1-.4 6.99z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/><line x1="8.5" y1="18" x2="7.5" y2="20.5" stroke="#0369a1" stroke-width="2"/><line x1="12.5" y1="18" x2="11.5" y2="20.5" stroke="#0369a1" stroke-width="2"/><line x1="16.5" y1="18" x2="15.5" y2="20.5" stroke="#0369a1" stroke-width="2"/></svg>
          <span class="temp">17°</span>
          <span class="rain-pct"><svg viewBox="0 0 24 24" fill="#0369a1"><path d="M12 2.5S5.5 10 5.5 14.5a6.5 6.5 0 0 0 13 0C18.5 10 12 2.5 12 2.5z"/></svg>90%</span>
        </div>
      </div>

      <!-- right-click menu on the "This week's forecast" header -->
      <div class="ctx-menu" style="left:60px;top:122px">
        <div class="ctx-item">Copy<span class="key">⌘C</span></div>
        <div class="ctx-sep"></div>
        <div class="ctx-item hi">Paste<span class="key">⌘V</span></div>
      </div>

      <!-- pointer hovering the Paste item -->
      <svg class="cursor" style="left:232px;top:198px" viewBox="0 0 24 24"><path d="M4 2 L4 21 L9.2 16 L12.3 22.5 L15.2 21.2 L12.1 14.9 L19 14.9 Z" fill="#111" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg>
    </div>
  </div>
</div>
<script src="dom-mover.js"></script>
</body></html>
