<!-- ===========================================================
     STARTER SLIDE. Duplicate per slide as 01-*.html, 02-*.html …
     Two common layouts:
       A) TEXT layout  → <div class="slide"> with .head/.body/.foot
       B) MOCKUP layout → <div class="slide center"> with a .window
     Delete whichever you don't use.
     =========================================================== -->

<!-- A) TEXT layout -->
<div class="slide">
  <div class="head"><div class="counter"><b>01</b> / 05</div></div>
  <div class="body">
    <div class="eyebrow">Eyebrow / kicker</div>
    <h1>Big headline<br>goes here</h1>
    <ul class="facts">
      <li>A supporting <strong>fact</strong>.</li>
      <li>Another one.</li>
    </ul>
  </div>
  <div class="foot"><div class="src">Source · <b>Author</b></div></div>
</div>
